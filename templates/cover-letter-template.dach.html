<!DOCTYPE html>
<!-- career-ops-template
name: DACH
version: 1.0.0
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Application — {{NAME}}</title>
<style>
  :root {
    --accent-color: #1B3A4B;
    --font-family: "Liberation Sans", Helvetica, Arial, sans-serif;
    --font-size: 10.5pt;
    --page-margin: 0.7in;
  }
  @page { margin: var(--page-margin); }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-variant-ligatures: none;
    font-feature-settings: "liga" 0, "clig" 0, "dlig" 0;
  }

  html {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  body {
    font-family: var(--font-family);
    font-size: var(--font-size);
    line-height: 1.45;
    color: #1a1f26;
    background: #ffffff;
    font-variant-ligatures: none;
    font-feature-settings: "liga" 0, "clig" 0, "dlig" 0;
  }

  .name {
    font-weight: 700;
    font-size: 13pt;
    color: var(--accent-color);
    margin-bottom: 2pt;
    letter-spacing: 0.01em;
  }

  .contact, .credentials {
    font-size: 9pt;
    color: #5c6570;
    line-height: 1.35;
    margin-bottom: 2pt;
  }

  .contact a, .credentials a, .footnotes a {
    color: var(--accent-color);
    text-decoration: none;
  }

  .divider {
    border: none;
    border-top: 1.25pt solid var(--accent-color);
    margin: 8pt 0 10pt;
  }

  .role-title {
    font-weight: 700;
    font-size: 11pt;
    color: #1a1f26;
    margin-bottom: 3pt;
  }

  .dateline {
    font-size: 9pt;
    color: #5c6570;
    margin-bottom: 14pt;
  }

  .greeting { margin-bottom: 9pt; }

  p { margin-bottom: 9pt; text-align: justify; }

  .achievements {
    list-style: none;
    margin: 0 0 9pt;
  }

  .achievements li {
    margin-bottom: 6pt;
    padding-left: 12pt;
    position: relative;
    text-align: justify;
  }

  .achievements li::before {
    content: "\2013";
    position: absolute;
    left: 0;
    color: var(--accent-color);
  }

  .language-closing {
    font-style: italic;
    margin-top: 2pt;
    margin-bottom: 8pt;
  }

  .signature {
    margin-top: 14pt;
    margin-bottom: 6pt;
  }

  .footnotes {
    margin-top: 12pt;
    padding-top: 6pt;
    border-top: 0.5pt solid #c5cdd6;
  }

  .footnotes p {
    font-size: 8pt;
    color: #888888;
    line-height: 1.3;
    margin-bottom: 3pt;
  }
</style>
</head>
<body>
  <div class="name">{{NAME}}</div>
  <div class="contact">{{CONTACT_LINE}}</div>
  {{CREDENTIALS_BLOCK}}
  <hr class="divider">

  <div class="role-title">Application: {{ROLE_TITLE}}</div>
  <div class="dateline">{{DATELINE}}</div>

  {{GREETING_BLOCK}}
  <p>{{OPENING}}</p>
  <p>{{PROFILE_INTRO}}</p>

  {{ACHIEVEMENTS_BLOCK}}

  {{PROBLEMS_BLOCK}}
  {{CLOSING_BLOCK}}
  {{LANGUAGE_CLOSING_BLOCK}}
  {{SIGNATURE_BLOCK}}
  {{FOOTNOTES_BLOCK}}
</body>
</html>
