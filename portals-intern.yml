# Portal Scanner Configuration — internship / working student only
# User layer. Used when the user asks to scan internship or working-student jobs.
# PowerShell: $env:CAREER_OPS_PORTALS = "portals-intern.yml"; node scan.mjs
#
# Do not include Trainee as a positive — Trainee programmes are full-time (portals.yml).

title_filter:
  positive:
    - "internship"
    - "word:intern"
    - "intern ("
    - "intern -"
    - "intern/"
    - " intern-"
    - "working student"
    - "student assistant"
  negative:
    - "word:senior"
    - "director"
    - "vice president"
    - "principal"
    - "head of"
    - "chief "
    - "ausbildung"
    - "apprentice"
    - "software engineer"
    - "developer"
    - "firmware"
    - "embedded"
    - "schülerpraktikum"
  seniority_boost: []

location_filter:
  always_allow:
    - "Germany"
    - "Deutschland"
    - "Munich"
    - "München"
    - "Berlin"
    - "Hamburg"
    - "Frankfurt"
    - "Cologne"
