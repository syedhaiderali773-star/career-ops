trust_filter:
  enabled: true

search_queries:
  - name: Greenhouse — Germany intern / WS
    query: 'site:job-boards.greenhouse.io ("Internship" OR Intern OR "Working Student" ) '
    enabled: true
  - name: Ashby — Germany intern / WS
    query: 'site:jobs.ashbyhq.com ("Internship" OR "Working Student") (Germany)'
    enabled: true
  - name: Personio — Germany intern / WS
    query: 'site:jobs.personio.de ( Internship OR "Working Student") (Deutschland)'
    enabled: true

